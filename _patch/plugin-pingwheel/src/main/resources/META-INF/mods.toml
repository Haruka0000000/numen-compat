[[mods]]
modId="numen_pingwheel"
version="1.0.0"
displayName="标记轮盘兼容"
description='''numen 的 Ping Wheel 兼容：在服务端记住主人用标记轮盘点的那些点，注册 pingwheel.ping 下的 latest 与 list，让同伴读得到「他刚才指的哪儿」。只记模组自己愿意转发的标记——坏包、超过限速的点、频道不对的包都不记；标记落在别的玩家身上时会照实说明「这不是主人打的」，标在会动的东西上时坐标跟着东西走，东西没了会直说坐标是当时的。标点所在的维度会一起报出来，不同维度不会拿着坐标硬算距离。'''
displayTest="IGNORE_SERVER_VERSION"

